<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#111111"/></marker><marker id="arrw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ffffff"/></marker><marker id="arrm" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#555555"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#e8e8e8" stroke-width="0.7"/></pattern><pattern id="gridd" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.07"/></pattern></defs><rect width="1100" height="620" fill="#ffffff"/><text x="40" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="2.6">FIGURE 13.1</text><text x="40" y="66" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Deployment topology</text><text x="40" y="88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Push to main, CI gates the merge, two hosts deploy, four managed services answer.</text><text x="40" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="1.8">SOURCE</text><text x="280" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="1.8">CI</text><text x="540" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="1.8">HOSTING</text><text x="800" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="1.8">MANAGED SERVICES</text><rect x="40" y="140" width="200" height="64" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="140.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">GitHub</text><text x="140.0" y="187.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">main + develop</text><rect x="280" y="140" width="200" height="64" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="380.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">GitHub Actions</text><text x="380.0" y="187.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">install · lint · test</text><rect x="280" y="240" width="200" height="64" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="380.0" y="270.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Build gate</text><text x="380.0" y="287.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">tests green → deploy</text><rect x="540" y="140" width="200" height="64" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="640.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Vercel</text><text x="640.0" y="187.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">React static build</text><rect x="540" y="240" width="200" height="64" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="640.0" y="270.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Render</text><text x="640.0" y="287.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Express API + sockets</text><rect x="800" y="140" width="200" height="58" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="900.0" y="167.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">MongoDB Atlas</text><text x="900.0" y="183.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">M0 cluster</text><rect x="800" y="210" width="200" height="58" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="900.0" y="237.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Cloudinary</text><text x="900.0" y="253.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">media CDN</text><rect x="800" y="280" width="200" height="58" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="900.0" y="307.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Khalti sandbox</text><text x="900.0" y="323.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">payments</text><rect x="800" y="350" width="200" height="58" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="900.0" y="377.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Gmail SMTP</text><text x="900.0" y="393.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">transactional mail</text><path d="M240,172 L280,172" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><text x="260.0" y="165.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">push</text><path d="M380,204 L380,240" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><path d="M480,252 L540,180" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><text x="474.0" y="214.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">deploy client</text><path d="M480,282 L540,272" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><text x="510.0" y="288.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">deploy API</text><path d="M640,204 L640,240" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/><text x="712.0" y="220.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">runtime HTTPS</text><path d="M740,272 L800,169" fill="none" stroke="#111111" stroke-width="0.9" marker-end="url(#arr)"/><path d="M740,272 L800,239" fill="none" stroke="#111111" stroke-width="0.9" marker-end="url(#arr)"/><path d="M740,272 L800,309" fill="none" stroke="#111111" stroke-width="0.9" marker-end="url(#arr)"/><path d="M740,272 L800,379" fill="none" stroke="#111111" stroke-width="0.9" marker-end="url(#arr)"/><text x="40" y="396" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Runtime data path: render → Atlas (Mongoose) · Cloudinary (signed upload) · Khalti (REST) · Gmail (SMTP).</text><text x="40" y="414" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">PR previews: one Vercel preview per branch, one Render preview environment for the API.</text><rect x="40" y="440" width="1020" height="140" rx="0" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1" opacity="1"/><text x="56" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#555555" opacity="1" letter-spacing="1.4">ENVIRONMENT VARIABLES — NAMES ONLY, VALUES LIVE IN THE HOST DASHBOARD</text><text x="56" y="486" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">NODE_ENV</text><text x="306" y="486" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">PORT</text><text x="556" y="486" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">MONGO_URI</text><text x="806" y="486" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">JWT_ACCESS_SECRET</text><text x="56" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">JWT_REFRESH_SECRET</text><text x="306" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">CLIENT_URL</text><text x="556" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">CLOUDINARY_CLOUD_NAME</text><text x="806" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">CLOUDINARY_API_KEY</text><text x="56" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">CLOUDINARY_API_SECRET</text><text x="306" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">SMTP_HOST</text><text x="556" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">SMTP_USER</text><text x="806" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">SMTP_PASS</text><text x="56" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">KHALTI_SECRET_KEY</text><text x="306" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">KHALTI_RETURN_URL</text><text x="556" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">VITE_API_URL</text><text x="40" y="602" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Rollback: Vercel instant revert · Render previous deploy · Atlas snapshot. Secrets never enter Git.</text></svg>