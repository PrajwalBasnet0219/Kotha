<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#111111"/></marker><marker id="arrw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ffffff"/></marker><marker id="arrm" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#555555"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#e8e8e8" stroke-width="0.7"/></pattern><pattern id="gridd" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.07"/></pattern></defs><rect width="1100" height="560" fill="#ffffff"/><text x="40" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="2.6">FIGURE 6.1</text><text x="40" y="66" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Blueprint to 3D pipeline</text><text x="40" y="88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">The same JSON drives the drawing, the geometry, the validation and the saved design.</text><rect x="30" y="160" width="190" height="96" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="125" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">01 · Blueprint</text><text x="125" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">walls, openings,</text><text x="125" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">scale, room type</text><path d="M220,208 L240,208" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><rect x="240" y="160" width="190" height="96" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="335" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">02 · Validate</text><text x="335" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Zod schema,</text><text x="335" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">bounds, closure</text><path d="M430,208 L450,208" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><rect x="450" y="160" width="190" height="96" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="545" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">03 · Geometry</text><text x="545" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">polygon → floor,</text><text x="545" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">wall segments</text><path d="M640,208 L660,208" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><rect x="660" y="160" width="190" height="96" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="755" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">04 · Scene</text><text x="755" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">outline render,</text><text x="755" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">dust, camera</text><path d="M850,208 L870,208" fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/><rect x="870" y="160" width="190" height="96" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="965" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">05 · Design</text><text x="965" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">placements,</text><text x="965" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">materials, cost</text><text x="125" y="150" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">blueprint JSON</text><text x="335" y="150" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">validated plan</text><text x="545" y="150" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">mesh graph</text><text x="755" y="150" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">scene state</text><text x="965" y="150" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">MongoDB</text><rect x="30" y="300" width="1040" height="120" rx="0" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1" opacity="1"/><text x="46" y="324" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#555555" opacity="1" letter-spacing="1.6">ACCURACY LAYER — EVERY VALUE IS DERIVED, NEVER TYPED</text><text x="46" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Area / perimeter</text><text x="46" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">shoelace formula on the wall</text><text x="46" y="381" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">polygon</text><text x="304" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Fit / overlap</text><text x="304" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">footprint OBB test against</text><text x="304" y="381" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">room bounds and neighbours</text><text x="562" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Server totals</text><text x="562" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">price and quantity</text><text x="562" y="381" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">recalculated on the API</text><text x="820" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Versioning</text><text x="820" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">immutable design snapshots,</text><text x="820" y="381" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">diffable restore</text><text x="30" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Fail-closed rules:</text><text x="140" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">an unclosed wall loop cannot generate a floor; a furniture item outside the room cannot be saved;</text><text x="140" y="476" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">a design whose furniture was deactivated is flagged, not silently rendered; every rejection returns a field-level error.</text><text x="30" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">Out of scope for this release: automatic wall detection from a photograph, AR preview, physics simulation.</text></svg>