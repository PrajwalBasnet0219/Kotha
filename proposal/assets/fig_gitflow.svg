"M900,234 L900,314" fill="none" stroke="#111111" stroke-width="1" marker-end="url(#arr)"/><text x="934.0" y="274.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">release</text><rect x="1024" y="304" width="58" height="17" rx="2" fill="#111111" stroke="#111111" stroke-width="1" opacity="1"/><text x="1053" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">v1.0</text><text x="40" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Commit convention: feat · fix · refactor · test · docs · chore (scope): summary.</text><text x="40" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Every PR: linked user story, screenshots for UI changes, tests for behaviour changes, one approval required.</text><text x="40" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">Protected branches: main (release only) and develop (integration). Direct pushes disabled.</text></svg>