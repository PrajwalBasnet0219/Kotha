<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#111111"/></marker><marker id="arrw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ffffff"/></marker><marker id="arrm" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#555555"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#e8e8e8" stroke-width="0.7"/></pattern><pattern id="gridd" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.07"/></pattern></defs><rect width="1100" height="810" fill="#ffffff"/><text x="40" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#9a9a9a" opacity="1" letter-spacing="2.6">FIGURE 11.1</text><text x="40" y="66" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">Authentication and token lifecycle</text><text x="40" y="88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Short-lived access token in memory, rotating refresh token in an httpOnly cookie.</text><rect x="70" y="95" width="140" height="44" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="140.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">CLIENT</text><text x="140.0" y="131.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">browser</text><line x1="140" y1="139" x2="140" y2="720" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4 4" opacity="1"/><rect x="360" y="95" width="140" height="44" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="430.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">API</text><text x="430.0" y="131.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Express</text><line x1="430" y1="139" x2="430" y2="720" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4 4" opacity="1"/><rect x="630" y="95" width="140" height="44" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="700.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">MONGODB</text><text x="700.0" y="131.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Atlas</text><line x1="700" y1="139" x2="700" y2="720" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4 4" opacity="1"/><rect x="880" y="95" width="140" height="44" rx="2" fill="#f4f4f4" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="950.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">SMTP</text><text x="950.0" y="131.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Gmail</text><line x1="950" y1="139" x2="950" y2="720" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4 4" opacity="1"/><path d="M140,165 L430,165" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">POST /auth/register { name, email,</text><text x="285.0" y="157" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">password }</text><circle cx="152" cy="149" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="152" y="152.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">1</text><path d="M430,210 L700,210" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="565.0" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">create user · isVerified = false</text><circle cx="442" cy="194" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="442" y="197.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">2</text><path d="M430,255 L950,255" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="690.0" y="247" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">send verification email (template)</text><circle cx="442" cy="239" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="442" y="242.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">3</text><path d="M140,300 L430,300" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">GET /auth/verify-email?token=…</text><circle cx="152" cy="284" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="152" y="287.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">4</text><path d="M430,345 L700,345" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="565.0" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">set isVerified = true · clear token</text><circle cx="442" cy="329" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="442" y="332.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">5</text><path d="M140,390 L430,390" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="382" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">POST /auth/login { email, password }</text><circle cx="152" cy="374" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="152" y="377.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">6</text><path d="M430,435 L700,435" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="565.0" y="427" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">find user by email</text><circle cx="442" cy="419" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="442" y="422.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">7</text><rect x="430" y="466" width="250" height="34" rx="2" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1" opacity="1"/><text x="555" y="487" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">bcrypt.compare(candidate, hash)</text><circle cx="410" cy="483" r="9" fill="#ffffff" stroke="#111111" stroke-width="1" opacity="1"/><text x="410" y="486.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#111111" opacity="1" letter-spacing="0">8</text><path d="M430,525 L700,525" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="565.0" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">store sha256(refreshToken) + expiry</text><circle cx="442" cy="509" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="442" y="512.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">9</text><path d="M430,570 L140,570" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="550" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">200 { accessToken } + refresh cookie</text><text x="285.0" y="562" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">(httpOnly)</text><circle cx="418" cy="554" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="418" y="557.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">10</text><path d="M140,615 L430,615" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="595" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">POST /auth/refresh (cookie only) →</text><text x="285.0" y="607" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">rotate</text><circle cx="152" cy="599" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="152" y="602.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">11</text><path d="M140,660 L430,660" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#arr)"/><text x="285.0" y="652" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" opacity="1" letter-spacing="0">POST /auth/logout → revoke stored hash</text><circle cx="152" cy="644" r="9" fill="#111111" stroke="#111111" stroke-width="1.2" opacity="1"/><text x="152" y="647.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#ffffff" opacity="1" letter-spacing="0">12</text><text x="40" y="752" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Revocation: refresh tokens are stored as SHA-256 hashes, rotated on every use, and revoked on logout.</text><text x="40" y="770" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555" opacity="1" letter-spacing="0">Access token 15 min · refresh 7 days · password reset token 15 min, single use, hashed at rest.</text><text x="40" y="788" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#9a9a9a" opacity="1" letter-spacing="0" font-style="italic">Forgot / reset: the response is identical for known and unknown emails, so the endpoint cannot enumerate accounts.</text></svg>